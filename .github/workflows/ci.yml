name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts and Nox integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run compile
      - run: docker info
      - run: npm test
      - run: npm run audit

  frontend:
    name: frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run audit

  release-images:
    name: production containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build private keeper image
        run: docker build -f Dockerfile.keeper -t swap-shield-keeper:ci .
      - name: Build public frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t swap-shield-web:ci \
            --build-arg VITE_TOKEN_IN_ADDRESS=0x0000000000000000000000000000000000000001 \
            --build-arg VITE_TOKEN_OUT_ADDRESS=0x0000000000000000000000000000000000000002 \
            --build-arg VITE_SHIELDED_TOKEN_IN_ADDRESS=0x0000000000000000000000000000000000000003 \
            --build-arg VITE_SHIELDED_TOKEN_OUT_ADDRESS=0x0000000000000000000000000000000000000004 \
            --build-arg VITE_SWAP_SHIELD_ROUTER_ADDRESS=0x0000000000000000000000000000000000000005 \
            --build-arg VITE_CHAIN_ID=11155111 \
            --build-arg VITE_POOL_FEE=3000 \
            .
